spring:
  application:
    name: healthforge-platform-api
  datasource:
    url: ${HEALTHFORGE_DB_URL:jdbc:postgresql://localhost:5433/healthforge}
    username: ${HEALTHFORGE_DB_USERNAME:healthforge}
    password: ${HEALTHFORGE_DB_PASSWORD:healthforge}
  jackson:
    property-naming-strategy: SNAKE_CASE
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-none}] %logger{36} - %msg%n"

healthforge:
  fhir:
    validation:
      packages:
        - package-id: hl7.fhir.r4.core
          package-version: 4.0.1
          package-title: HL7 FHIR R4 Core
          package-kind: base_specification
          support-status: supported
          validation-boundary: Deterministic base-profile validation against pinned HL7 FHIR R4 core artifacts only.
          package-evidence-link: https://hl7.org/fhir/R4/downloads.html
          profiles:
            - profile-url: http://hl7.org/fhir/StructureDefinition/Patient
              profile-title: FHIR R4 Patient
              support-status: supported
              validation-scope: base_profile_validation
              profile-evidence-link: https://hl7.org/fhir/R4/patient.html
            - profile-url: http://hl7.org/fhir/StructureDefinition/Observation
              profile-title: FHIR R4 Observation
              support-status: supported
              validation-scope: base_profile_validation
              profile-evidence-link: https://hl7.org/fhir/R4/observation.html
            - profile-url: http://hl7.org/fhir/StructureDefinition/Claim
              profile-title: FHIR R4 Claim
              support-status: supported
              validation-scope: base_profile_validation
              profile-evidence-link: https://hl7.org/fhir/R4/claim.html
            - profile-url: http://hl7.org/fhir/StructureDefinition/ClaimResponse
              profile-title: FHIR R4 ClaimResponse
              support-status: supported
              validation-scope: base_profile_validation
              profile-evidence-link: https://hl7.org/fhir/R4/claimresponse.html
            - profile-url: http://hl7.org/fhir/StructureDefinition/Coverage
              profile-title: FHIR R4 Coverage
              support-status: supported
              validation-scope: base_profile_validation
              profile-evidence-link: https://hl7.org/fhir/R4/coverage.html
            - profile-url: http://hl7.org/fhir/StructureDefinition/Bundle
              profile-title: FHIR R4 Bundle
              support-status: supported
              validation-scope: base_profile_validation
              profile-evidence-link: https://hl7.org/fhir/R4/bundle.html
        - package-id: hl7.fhir.us.davinci-pas
          package-version: 2.1.0
          package-title: Da Vinci Prior Authorization Support (PAS) STU 2.1
          package-kind: implementation_guide
          support-status: planned
          validation-boundary: Implementation-guide validation requires pinned IG package artifacts and explicit review before deterministic support is enabled.
          package-evidence-link: https://hl7.org/fhir/us/davinci-pas/STU2.1/
          profiles:
            - profile-url: http://hl7.org/fhir/us/davinci-pas/StructureDefinition/profile-claim
              profile-title: PAS Claim Profile
              support-status: planned
              validation-scope: implementation_guide_validation
              profile-evidence-link: https://hl7.org/fhir/us/davinci-pas/STU2.1/StructureDefinition-profile-claim.html
  standards:
    artifacts:
      - artifact-id: fhir-r4-claim
        canonical-url: http://hl7.org/fhir/StructureDefinition/Claim
        title: FHIR R4 Claim
        version: 4.0.1
        artifact-type: resource
        package-id: hl7.fhir.r4.core
        source-id: hl7-fhir-r4
        source-version: 4.0.1
        support-boundary: Base FHIR resource reference for prior-authorization request modeling; implementation details still require guide and deployment review.
        evidence-links:
          - https://hl7.org/fhir/R4/claim.html
        keywords:
          - claim
          - prior authorization
          - resource
      - artifact-id: fhir-r4-claimresponse
        canonical-url: http://hl7.org/fhir/StructureDefinition/ClaimResponse
        title: FHIR R4 ClaimResponse
        version: 4.0.1
        artifact-type: resource
        package-id: hl7.fhir.r4.core
        source-id: hl7-fhir-r4
        source-version: 4.0.1
        support-boundary: Base FHIR response resource reference for review of authorization decisions and status updates.
        evidence-links:
          - https://hl7.org/fhir/R4/claimresponse.html
        keywords:
          - claimresponse
          - prior authorization
          - response
      - artifact-id: pas-claim-profile
        canonical-url: http://hl7.org/fhir/us/davinci-pas/StructureDefinition/profile-claim
        title: PAS Claim Profile
        version: 2.1.0
        artifact-type: profile
        package-id: hl7.fhir.us.davinci-pas
        source-id: davinci-pas-stu-2-1
        source-version: STU2.1
        support-boundary: Candidate PAS implementation-guide profile; applicability and trading-partner support must be reviewed per deployment.
        evidence-links:
          - https://hl7.org/fhir/us/davinci-pas/STU2.1/StructureDefinition-profile-claim.html
        keywords:
          - pas
          - claim
          - prior authorization support
      - artifact-id: crd-implementation-guide
        canonical-url: https://hl7.org/fhir/us/davinci-crd/STU2.1/
        title: Da Vinci Coverage Requirements Discovery (CRD) STU 2.1
        version: 2.1.0
        artifact-type: implementation_guide
        package-id: hl7.fhir.us.davinci-crd
        source-id: davinci-crd-stu-2-1
        source-version: STU2.1
        support-boundary: Candidate workflow guidance for coverage and documentation discovery; not a universal deployment requirement.
        evidence-links:
          - https://hl7.org/fhir/us/davinci-crd/STU2.1/
        keywords:
          - crd
          - coverage requirements discovery
          - cds hooks
      - artifact-id: dtr-implementation-guide
        canonical-url: https://hl7.org/fhir/us/davinci-dtr/
        title: Da Vinci Documentation Templates and Rules (DTR)
        version: 2.1.0
        artifact-type: implementation_guide
        package-id: hl7.fhir.us.davinci-dtr
        source-id: davinci-dtr-stu-2-1
        source-version: STU2.1
        support-boundary: Candidate documentation workflow guidance; local persistence, user edits, and deployment applicability still require review.
        evidence-links:
          - https://hl7.org/fhir/us/davinci-dtr/
        keywords:
          - dtr
          - documentation templates and rules
          - questionnaire
      - artifact-id: pas-submit-operation
        canonical-url: https://hl7.org/fhir/us/davinci-pas/STU2.1/
        title: PAS $submit workflow touchpoint
        version: 2.1.0
        artifact-type: operation
        package-id: hl7.fhir.us.davinci-pas
        source-id: davinci-pas-stu-2-1
        source-version: STU2.1
        support-boundary: Curated PAS workflow touchpoint for prior-authorization submission review; actual operation support and payload shape must be validated per counterparty.
        evidence-links:
          - https://hl7.org/fhir/us/davinci-pas/STU2.1/
        keywords:
          - pas
          - $submit
          - submit
          - prior authorization
          - operation
      - artifact-id: crd-discovery-workflow
        canonical-url: https://hl7.org/fhir/us/davinci-crd/STU2.1/
        title: CRD discovery workflow touchpoint
        version: 2.1.0
        artifact-type: operation
        package-id: hl7.fhir.us.davinci-crd
        source-id: davinci-crd-stu-2-1
        source-version: STU2.1
        support-boundary: Curated CRD workflow touchpoint for coverage-requirements discovery review; payer and deployment applicability remain reviewer decisions.
        evidence-links:
          - https://hl7.org/fhir/us/davinci-crd/STU2.1/
        keywords:
          - crd
          - discovery
          - coverage
          - workflow
          - operation
      - artifact-id: dtr-documentation-workflow
        canonical-url: https://hl7.org/fhir/us/davinci-dtr/
        title: DTR documentation workflow touchpoint
        version: 2.1.0
        artifact-type: operation
        package-id: hl7.fhir.us.davinci-dtr
        source-id: davinci-dtr-stu-2-1
        source-version: STU2.1
        support-boundary: Curated DTR workflow touchpoint for documentation/questionnaire review; local persistence and counterparty support remain human-review decisions.
        evidence-links:
          - https://hl7.org/fhir/us/davinci-dtr/
        keywords:
          - dtr
          - documentation
          - questionnaire
          - workflow
          - operation
  workspace:
    root-directory: ${HEALTHFORGE_WORKSPACE_ROOT:${user.dir}/../..}
  model:
    enabled: ${HEALTHFORGE_MODEL_ENABLED:false}
    provider: ${HEALTHFORGE_MODEL_PROVIDER:disabled}
    prompt-template-version: evidence-packet-v1
  storage:
    artifact-directory: ${HEALTHFORGE_ARTIFACT_DIRECTORY:${user.home}/.healthforge/artifacts}
  mvp:
    sources:
      cms-0057-f-final-rule:
        canonical-url: https://www.cms.gov/files/document/cms-0057-f.pdf
        title: CMS Interoperability and Prior Authorization Final Rule (CMS-0057-F)
        source-type: governing_regulation
        content-types:
          - application/pdf
      cms-prior-auth-api-workflow:
        canonical-url: https://www.cms.gov/files/document/prior-authorization-api-workflow-cms-0057-f.pdf
        title: Prior Authorization Application Programming Interface Workflow
        source-type: authoritative_implementation_guidance
        content-types:
          - application/pdf
      cms-0057-f-faqs:
        canonical-url: https://www.cms.gov/priorities/key-initiatives/burden-reduction/interoperability/faqs
        title: CMS Interoperability FAQs
        source-type: authoritative_implementation_guidance
        content-types:
          - text/html
      healthforge-mvp-corpus-policy:
        canonical-url: hf-local:///docs/06-mvp-source-corpus.md
        title: HealthForge MVP Corpus Policy
        source-type: internal_project_material
        content-types:
          - text/markdown
      healthforge-prior-auth-workflow:
        canonical-url: hf-local:///docs/07-electronic-prior-authorization-workflow.md
        title: HealthForge Prior Authorization Workflow
        source-type: internal_project_material
        content-types:
          - text/markdown
      healthforge-engineering-brief-contract:
        canonical-url: hf-local:///docs/08-regulation-to-engineering-brief-contract.md
        title: HealthForge Engineering Brief Contract
        source-type: internal_project_material
        content-types:
          - text/markdown
      hl7-fhir-r4:
        canonical-url: https://hl7.org/fhir/R4/
        title: HL7 FHIR Release 4
        source-type: candidate_technical_guidance
        content-types:
          - text/html
      davinci-pas-stu-2-1:
        canonical-url: https://hl7.org/fhir/us/davinci-pas/STU2.1/
        title: Da Vinci Prior Authorization Support (PAS) STU 2.1
        source-type: candidate_technical_guidance
        content-types:
          - text/html
      davinci-crd-stu-2-1:
        canonical-url: https://hl7.org/fhir/us/davinci-crd/STU2.1/
        title: Da Vinci Coverage Requirements Discovery (CRD) STU 2.1
        source-type: candidate_technical_guidance
        content-types:
          - text/html
      davinci-dtr-stu-2-1:
        canonical-url: https://hl7.org/fhir/us/davinci-dtr/
        title: Da Vinci Documentation Templates and Rules (DTR)
        source-type: candidate_technical_guidance
        content-types:
          - text/html
