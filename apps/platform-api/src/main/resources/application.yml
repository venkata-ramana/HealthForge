spring:
  application:
    name: healthforge-platform-api
  datasource:
    url: ${HEALTHFORGE_DB_URL:jdbc:postgresql://localhost:5433/healthforge}
    username: ${HEALTHFORGE_DB_USERNAME:healthforge}
    password: ${HEALTHFORGE_DB_PASSWORD:healthforge}
  jackson:
    property-naming-strategy: SNAKE_CASE
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

healthforge:
  model:
    enabled: ${HEALTHFORGE_MODEL_ENABLED:false}
    provider: ${HEALTHFORGE_MODEL_PROVIDER:disabled}
    prompt-template-version: evidence-packet-v1
  storage:
    artifact-directory: ${HEALTHFORGE_ARTIFACT_DIRECTORY:${user.home}/.healthforge/artifacts}
  mvp:
    sources:
      cms-0057-f-final-rule:
        canonical-url: https://www.cms.gov/files/document/cms-0057-f.pdf
        title: CMS Interoperability and Prior Authorization Final Rule (CMS-0057-F)
        source-type: governing_regulation
        content-types:
          - application/pdf
      cms-prior-auth-api-workflow:
        canonical-url: https://www.cms.gov/files/document/prior-authorization-api-workflow-cms-0057-f.pdf
        title: Prior Authorization Application Programming Interface Workflow
        source-type: authoritative_implementation_guidance
        content-types:
          - application/pdf
