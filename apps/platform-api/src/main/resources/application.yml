spring:
  application:
    name: healthforge-platform-api
  datasource:
    url: ${HEALTHFORGE_DB_URL:jdbc:postgresql://localhost:5433/healthforge}
    username: ${HEALTHFORGE_DB_USERNAME:healthforge}
    password: ${HEALTHFORGE_DB_PASSWORD:healthforge}
  jackson:
    property-naming-strategy: SNAKE_CASE
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-none}] %logger{36} - %msg%n"

healthforge:
  auth:
    mode: ${HEALTHFORGE_AUTH_MODE:local_header}
    default-organization-id: ${HEALTHFORGE_DEFAULT_ORGANIZATION_ID:local.default}
    trusted-subject-header: ${HEALTHFORGE_TRUSTED_SUBJECT_HEADER:X-HealthForge-Subject}
    trusted-display-name-header: ${HEALTHFORGE_TRUSTED_DISPLAY_NAME_HEADER:X-HealthForge-Display-Name}
    trusted-groups-header: ${HEALTHFORGE_TRUSTED_GROUPS_HEADER:X-HealthForge-Groups}
    group-role-mappings:
      - group: reviewers
        role: reviewer
        scope: Maps enterprise review groups into HealthForge reviewer access.
      - group: approvers
        role: approver
        scope: Maps enterprise approval groups into approval and governed export access.
      - group: auditors
        role: auditor
        scope: Maps enterprise audit groups into oversight dashboards and safety reporting.
      - group: administrators
        role: administrator
        scope: Maps platform operators into identity, access review, and deployment administration.
  integrations:
    github:
      enabled: ${HEALTHFORGE_GITHUB_CONNECTOR_ENABLED:false}
      execution-mode: ${HEALTHFORGE_GITHUB_CONNECTOR_MODE:simulated}
      allow-live-calls: ${HEALTHFORGE_GITHUB_CONNECTOR_LIVE:false}
      base-url: ${HEALTHFORGE_GITHUB_CONNECTOR_BASE_URL:https://api.github.com}
      credential-reference: ${HEALTHFORGE_GITHUB_CONNECTOR_CREDENTIAL:env:HEALTHFORGE_GITHUB_TOKEN}
    jira:
      enabled: ${HEALTHFORGE_JIRA_CONNECTOR_ENABLED:false}
      execution-mode: ${HEALTHFORGE_JIRA_CONNECTOR_MODE:simulated}
      allow-live-calls: ${HEALTHFORGE_JIRA_CONNECTOR_LIVE:false}
      base-url: ${HEALTHFORGE_JIRA_CONNECTOR_BASE_URL:https://jira.example.local}
      credential-reference: ${HEALTHFORGE_JIRA_CONNECTOR_CREDENTIAL:env:HEALTHFORGE_JIRA_TOKEN}
      project-key: ${HEALTHFORGE_JIRA_PROJECT_KEY:HF}
    notion:
      enabled: ${HEALTHFORGE_NOTION_CONNECTOR_ENABLED:false}
      execution-mode: ${HEALTHFORGE_NOTION_CONNECTOR_MODE:simulated}
      allow-live-calls: ${HEALTHFORGE_NOTION_CONNECTOR_LIVE:false}
      base-url: ${HEALTHFORGE_NOTION_CONNECTOR_BASE_URL:https://api.notion.com}
      credential-reference: ${HEALTHFORGE_NOTION_CONNECTOR_CREDENTIAL:env:HEALTHFORGE_NOTION_TOKEN}
    sharepoint:
      enabled: ${HEALTHFORGE_SHAREPOINT_CONNECTOR_ENABLED:false}
      execution-mode: ${HEALTHFORGE_SHAREPOINT_CONNECTOR_MODE:simulated}
      allow-live-calls: ${HEALTHFORGE_SHAREPOINT_CONNECTOR_LIVE:false}
      base-url: ${HEALTHFORGE_SHAREPOINT_CONNECTOR_BASE_URL:https://graph.microsoft.com}
      credential-reference: ${HEALTHFORGE_SHAREPOINT_CONNECTOR_CREDENTIAL:env:HEALTHFORGE_SHAREPOINT_TOKEN}
    confluence:
      enabled: ${HEALTHFORGE_CONFLUENCE_CONNECTOR_ENABLED:false}
      execution-mode: ${HEALTHFORGE_CONFLUENCE_CONNECTOR_MODE:simulated}
      allow-live-calls: ${HEALTHFORGE_CONFLUENCE_CONNECTOR_LIVE:false}
      base-url: ${HEALTHFORGE_CONFLUENCE_CONNECTOR_BASE_URL:https://confluence.example.local}
      credential-reference: ${HEALTHFORGE_CONFLUENCE_CONNECTOR_CREDENTIAL:env:HEALTHFORGE_CONFLUENCE_TOKEN}
  audit:
    policy:
      policy-version: ${HEALTHFORGE_AUDIT_POLICY_VERSION:private-demo-v1}
      tracked-export-retention-days: ${HEALTHFORGE_TRACKED_EXPORT_RETENTION_DAYS:30}
      validation-telemetry-retention: ${HEALTHFORGE_VALIDATION_TELEMETRY_RETENTION:Retained in the local telemetry store until an operator rotates or archives it.}
      audit-evidence-retention: ${HEALTHFORGE_AUDIT_EVIDENCE_RETENTION:Retained in the local platform database to preserve review traceability for approved engineering outputs.}
      access-review-cadence: ${HEALTHFORGE_ACCESS_REVIEW_CADENCE:Review organization access at least quarterly for private pilots.}
      role-review-expectation: ${HEALTHFORGE_ROLE_REVIEW_EXPECTATION:Administrators should confirm reviewer, approver, auditor, and administrator assignments remain justified and organization scoped.}
      approval-required-for-exports: ${HEALTHFORGE_APPROVAL_REQUIRED_FOR_EXPORTS:true}
  operations:
    deployment-tier: ${HEALTHFORGE_DEPLOYMENT_TIER:private_demo_plus_ops}
    environments:
      - environment-name: demo
        promotion-gate: Guided sandbox verification and operator walk-through complete before external demo use.
        secret-boundary: Demo uses local or preview-only references with no production credential crossover.
        change-window: On-demand during active operator supervision.
        data-boundary: Synthetic sources and non-sensitive examples only.
      - environment-name: staging
        promotion-gate: Access review, retention review, and rollback rehearsal complete before promotion.
        secret-boundary: Environment-scoped secret references resolved through the target deployment manager.
        change-window: Planned operator window with recovery contact identified.
        data-boundary: Internal validation with governed connector targets and synthetic artifacts.
      - environment-name: private_prod
        promotion-gate: Operator sign-off, continuity checklist, and environment policy acknowledgment recorded.
        secret-boundary: Secrets remain externally managed and rotatable without code changes.
        change-window: Approved maintenance or incident-driven operator window only.
        data-boundary: Customer-private deployment boundary with organization-scoped audit preservation.
    config-boundaries:
      - key: spring.datasource.url
        classification: environment_runtime
        source: environment variable
        exposure-policy: Show endpoint family only; never display credentials.
        rationale: Database host and database name are deployment-scoped assumptions rather than application logic.
      - key: healthforge.auth.mode
        classification: identity_control
        source: environment variable
        exposure-policy: Safe to summarize as current auth posture.
        rationale: Operators need to explain whether the workspace is using local headers or trusted-proxy identity.
      - key: healthforge.integrations.*.credential-reference
        classification: secret_reference
        source: environment variable
        exposure-policy: Show reference pattern only; never resolve or display raw secret values.
        rationale: Connector credentials are governance-critical and should remain explainable without being exposed.
      - key: healthforge.audit.policy.*
        classification: retention_policy
        source: application config
        exposure-policy: Safe to display as policy summary.
        rationale: Retention rules are part of the enterprise operating model and must be reviewable by auditors and administrators.
      - key: healthforge.operations.quotas
        classification: quota_policy
        source: application config
        exposure-policy: Safe to display as advisory limits and operator guidance.
        rationale: Soft quotas help private operators communicate workload expectations and future packaging boundaries.
    secret-references:
      - system: github
        reference: env:HEALTHFORGE_GITHUB_TOKEN
        rotation-expectation: Rotate on connector onboarding changes and after incident review.
        usage-boundary: Used only when the connector is enabled and permitted for the current environment.
      - system: jira
        reference: env:HEALTHFORGE_JIRA_TOKEN
        rotation-expectation: Rotate when project access changes or when delivery behavior is reauthorized.
        usage-boundary: Governs simulated or live-capable tracker delivery based on environment policy.
      - system: notion
        reference: env:HEALTHFORGE_NOTION_TOKEN
        rotation-expectation: Rotate when workspace publishing scope changes.
        usage-boundary: Applies only to governed documentation export workflows.
      - system: sharepoint
        reference: env:HEALTHFORGE_SHAREPOINT_TOKEN
        rotation-expectation: Rotate with tenant or publishing-boundary changes.
        usage-boundary: Applies only to environment-enabled collaboration/document export paths.
      - system: confluence
        reference: env:HEALTHFORGE_CONFLUENCE_TOKEN
        rotation-expectation: Rotate after credential ownership or scope changes.
        usage-boundary: Used for governed documentation publishing workflows only.
    observability-runbooks:
      - Review actuator health, connector receipts, blocked delivery queue, and the latest audit events together before declaring a workflow incident.
      - Treat retention drift, blocked connectors, and repeated insufficient-evidence responses as separate operator narratives with different follow-up actions.
      - Rehearse preview-only rollback before re-enabling governed writeback after an incident.
    retention-checks:
      - Confirm tracked export retention-until metadata is still aligned with the active audit policy.
      - Review validation telemetry volume and archive or rotate it according to operator guidance.
      - Preserve audit and attestation history before any cleanup or environment movement.
    continuity-checks:
      - Validate flyway migration level, organization counts, and approval/audit read paths before and after restore.
      - Confirm connector modes remain correct for the target environment before resuming outbound delivery.
      - Verify one representative Brief, validation run, tracked export, and attestation record after migration.
    quotas:
      - metric: briefs_last_30_days
        soft-limit: ${HEALTHFORGE_BRIEF_SOFT_LIMIT_30_DAYS:120}
        window: 30 days
        rationale: Helps operators communicate private deployment workload expectations for review-heavy programs.
      - metric: answers_last_30_days
        soft-limit: ${HEALTHFORGE_ANSWER_SOFT_LIMIT_30_DAYS:600}
        window: 30 days
        rationale: Useful proxy for retrieval, AI-assist, and reviewer demand.
      - metric: validations_last_30_days
        soft-limit: ${HEALTHFORGE_VALIDATION_SOFT_LIMIT_30_DAYS:200}
        window: 30 days
        rationale: Tracks standards-validation pressure and future runtime/package expansion needs.
      - metric: tracked_exports_last_30_days
        soft-limit: ${HEALTHFORGE_EXPORT_SOFT_LIMIT_30_DAYS:150}
        window: 30 days
        rationale: Delivery volume predicts downstream coordination, retries, and operator oversight cost.
      - metric: inbound_cases_last_30_days
        soft-limit: ${HEALTHFORGE_INBOUND_CASE_SOFT_LIMIT_30_DAYS:100}
        window: 30 days
        rationale: Helps teams reason about intake-driven workload for future tenant-aware packaging.
    expected-attestations:
      - Record a sign-off before promoting connector mode changes from preview-only to governed writeback.
      - Record a sign-off after continuity rehearsal, restore rehearsal, or migration validation is completed.
      - Record a sign-off when identity mode, retention expectations, or quota guidance materially changes.
  fhir:
    validation:
      packages:
        - package-id: hl7.fhir.r4.core
          package-version: 4.0.1
          package-title: HL7 FHIR R4 Core
          package-kind: base_specification
          support-status: supported
          validation-boundary: Deterministic base-profile validation against pinned HL7 FHIR R4 core artifacts only.
          package-evidence-link: https://hl7.org/fhir/R4/downloads.html
          profiles:
            - profile-url: http://hl7.org/fhir/StructureDefinition/Patient
              profile-title: FHIR R4 Patient
              support-status: supported
              validation-scope: base_profile_validation
              profile-evidence-link: https://hl7.org/fhir/R4/patient.html
            - profile-url: http://hl7.org/fhir/StructureDefinition/Observation
              profile-title: FHIR R4 Observation
              support-status: supported
              validation-scope: base_profile_validation
              profile-evidence-link: https://hl7.org/fhir/R4/observation.html
            - profile-url: http://hl7.org/fhir/StructureDefinition/Claim
              profile-title: FHIR R4 Claim
              support-status: supported
              validation-scope: base_profile_validation
              profile-evidence-link: https://hl7.org/fhir/R4/claim.html
            - profile-url: http://hl7.org/fhir/StructureDefinition/ClaimResponse
              profile-title: FHIR R4 ClaimResponse
              support-status: supported
              validation-scope: base_profile_validation
              profile-evidence-link: https://hl7.org/fhir/R4/claimresponse.html
            - profile-url: http://hl7.org/fhir/StructureDefinition/Coverage
              profile-title: FHIR R4 Coverage
              support-status: supported
              validation-scope: base_profile_validation
              profile-evidence-link: https://hl7.org/fhir/R4/coverage.html
            - profile-url: http://hl7.org/fhir/StructureDefinition/Bundle
              profile-title: FHIR R4 Bundle
              support-status: supported
              validation-scope: base_profile_validation
              profile-evidence-link: https://hl7.org/fhir/R4/bundle.html
        - package-id: hl7.fhir.us.davinci-pas
          package-version: 2.1.0
          package-title: Da Vinci Prior Authorization Support (PAS) STU 2.1
          package-kind: implementation_guide
          support-status: planned
          validation-boundary: Implementation-guide validation requires pinned IG package artifacts and explicit review before deterministic support is enabled.
          package-evidence-link: https://hl7.org/fhir/us/davinci-pas/STU2.1/
          profiles:
            - profile-url: http://hl7.org/fhir/us/davinci-pas/StructureDefinition/profile-claim
              profile-title: PAS Claim Profile
              support-status: planned
              validation-scope: implementation_guide_validation
              profile-evidence-link: https://hl7.org/fhir/us/davinci-pas/STU2.1/StructureDefinition-profile-claim.html
  standards:
    artifacts:
      - artifact-id: fhir-r4-claim
        canonical-url: http://hl7.org/fhir/StructureDefinition/Claim
        title: FHIR R4 Claim
        version: 4.0.1
        artifact-type: resource
        package-id: hl7.fhir.r4.core
        source-id: hl7-fhir-r4
        source-version: 4.0.1
        support-boundary: Base FHIR resource reference for prior-authorization request modeling; implementation details still require guide and deployment review.
        evidence-links:
          - https://hl7.org/fhir/R4/claim.html
        keywords:
          - claim
          - prior authorization
          - resource
      - artifact-id: fhir-r4-claimresponse
        canonical-url: http://hl7.org/fhir/StructureDefinition/ClaimResponse
        title: FHIR R4 ClaimResponse
        version: 4.0.1
        artifact-type: resource
        package-id: hl7.fhir.r4.core
        source-id: hl7-fhir-r4
        source-version: 4.0.1
        support-boundary: Base FHIR response resource reference for review of authorization decisions and status updates.
        evidence-links:
          - https://hl7.org/fhir/R4/claimresponse.html
        keywords:
          - claimresponse
          - prior authorization
          - response
      - artifact-id: pas-claim-profile
        canonical-url: http://hl7.org/fhir/us/davinci-pas/StructureDefinition/profile-claim
        title: PAS Claim Profile
        version: 2.1.0
        artifact-type: profile
        package-id: hl7.fhir.us.davinci-pas
        source-id: davinci-pas-stu-2-1
        source-version: STU2.1
        support-boundary: Candidate PAS implementation-guide profile; applicability and trading-partner support must be reviewed per deployment.
        evidence-links:
          - https://hl7.org/fhir/us/davinci-pas/STU2.1/StructureDefinition-profile-claim.html
        keywords:
          - pas
          - claim
          - prior authorization support
      - artifact-id: crd-implementation-guide
        canonical-url: https://hl7.org/fhir/us/davinci-crd/STU2.1/
        title: Da Vinci Coverage Requirements Discovery (CRD) STU 2.1
        version: 2.1.0
        artifact-type: implementation_guide
        package-id: hl7.fhir.us.davinci-crd
        source-id: davinci-crd-stu-2-1
        source-version: STU2.1
        support-boundary: Candidate workflow guidance for coverage and documentation discovery; not a universal deployment requirement.
        evidence-links:
          - https://hl7.org/fhir/us/davinci-crd/STU2.1/
        keywords:
          - crd
          - coverage requirements discovery
          - cds hooks
      - artifact-id: dtr-implementation-guide
        canonical-url: https://hl7.org/fhir/us/davinci-dtr/
        title: Da Vinci Documentation Templates and Rules (DTR)
        version: 2.1.0
        artifact-type: implementation_guide
        package-id: hl7.fhir.us.davinci-dtr
        source-id: davinci-dtr-stu-2-1
        source-version: STU2.1
        support-boundary: Candidate documentation workflow guidance; local persistence, user edits, and deployment applicability still require review.
        evidence-links:
          - https://hl7.org/fhir/us/davinci-dtr/
        keywords:
          - dtr
          - documentation templates and rules
          - questionnaire
      - artifact-id: pas-submit-operation
        canonical-url: https://hl7.org/fhir/us/davinci-pas/STU2.1/
        title: PAS $submit workflow touchpoint
        version: 2.1.0
        artifact-type: operation
        package-id: hl7.fhir.us.davinci-pas
        source-id: davinci-pas-stu-2-1
        source-version: STU2.1
        support-boundary: Curated PAS workflow touchpoint for prior-authorization submission review; actual operation support and payload shape must be validated per counterparty.
        evidence-links:
          - https://hl7.org/fhir/us/davinci-pas/STU2.1/
        keywords:
          - pas
          - $submit
          - submit
          - prior authorization
          - operation
      - artifact-id: crd-discovery-workflow
        canonical-url: https://hl7.org/fhir/us/davinci-crd/STU2.1/
        title: CRD discovery workflow touchpoint
        version: 2.1.0
        artifact-type: operation
        package-id: hl7.fhir.us.davinci-crd
        source-id: davinci-crd-stu-2-1
        source-version: STU2.1
        support-boundary: Curated CRD workflow touchpoint for coverage-requirements discovery review; payer and deployment applicability remain reviewer decisions.
        evidence-links:
          - https://hl7.org/fhir/us/davinci-crd/STU2.1/
        keywords:
          - crd
          - discovery
          - coverage
          - workflow
          - operation
      - artifact-id: dtr-documentation-workflow
        canonical-url: https://hl7.org/fhir/us/davinci-dtr/
        title: DTR documentation workflow touchpoint
        version: 2.1.0
        artifact-type: operation
        package-id: hl7.fhir.us.davinci-dtr
        source-id: davinci-dtr-stu-2-1
        source-version: STU2.1
        support-boundary: Curated DTR workflow touchpoint for documentation/questionnaire review; local persistence and counterparty support remain human-review decisions.
        evidence-links:
          - https://hl7.org/fhir/us/davinci-dtr/
        keywords:
          - dtr
          - documentation
          - questionnaire
          - workflow
          - operation
  workspace:
    root-directory: ${HEALTHFORGE_WORKSPACE_ROOT:${user.dir}/../..}
  model:
    enabled: ${HEALTHFORGE_MODEL_ENABLED:false}
    provider: ${HEALTHFORGE_MODEL_PROVIDER:disabled}
    prompt-template-version: evidence-packet-v1
  storage:
    artifact-directory: ${HEALTHFORGE_ARTIFACT_DIRECTORY:${user.home}/.healthforge/artifacts}
  mvp:
    sources:
      cms-0057-f-final-rule:
