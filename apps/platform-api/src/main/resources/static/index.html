<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HealthForge Brief Review</title><style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui;background:#f4f7fa;color:#17212b}header{background:#073b4c;color:#fff;padding:22px 5%;display:flex;justify-content:space-between;gap:16px}main{display:grid;grid-template-columns:340px 1fr;gap:24px;padding:28px 5%}button,select,input,textarea{font:inherit;padding:9px;border:1px solid #97a6b5;border-radius:6px;width:100%}button{background:#006d77;color:#fff;border:0;cursor:pointer;font-weight:700}button:hover{background:#005b64}button:focus,input:focus,textarea:focus,select:focus{outline:3px solid #83d3dc;outline-offset:2px}.card{background:#fff;border:1px solid #d6e0e7;border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px #1525360c}.brief{width:100%;text-align:left;background:#fff;color:#17212b;border:1px solid #d6e0e7;margin:5px 0;font-weight:400}.brief:hover{border-color:#006d77;background:#f1fbfc}.status{font-size:12px;text-transform:uppercase;color:#006d77;font-weight:800;letter-spacing:.04em}.finding{border-left:4px solid #006d77;padding:4px 0 4px 14px;margin:22px 0}.citation{background:#eef8f9;border:1px solid #bfebef;padding:12px;border-radius:6px;font-size:14px}.alert{padding:12px;border-radius:6px;margin-top:12px;font-weight:600}.alert.error{background:#fff0f0;border:1px solid #f3aaaa;color:#8e1d1d}.alert.warning{background:#fff7df;border:1px solid #edcf78;color:#6b5000}.alert.success{background:#eaf8ef;border:1px solid #9ad1aa;color:#155c2d}textarea{min-height:96px;resize:vertical}label{display:block;margin:12px 0 5px;font-weight:700}label+label{margin-top:12px}a{color:#005f6a;font-weight:650}#empty{color:#52616d}@media(max-width:760px){header,main{display:block}main{padding:18px}header>div:last-child{margin-top:8px;font-size:13px}}
</style></head><body><header><div><strong>HealthForge</strong><div>Local Brief review</div></div><div>No PHI · Human review required</div></header><main><aside><div class="card"><h2>Start a Brief</h2><p>Use public, non-sensitive engineering context only.</p><label>Question <textarea id="question" placeholder="What does the rule say about prior authorization?"></textarea></label><label>Project context <textarea id="context" placeholder="Describe the non-sensitive engineering scenario."></textarea></label><label>Corpus ID <input id="corpusId" value="mvp-regulatory-corpus"></label><label>Corpus version <input id="corpusVersion" value="2026-07-24"></label><button onclick="previewEvidence()">Find cited evidence</button><div id="evidence"></div></div><div class="card"><button id="refresh">Refresh Briefs</button><div id="briefs"></div></div></aside><section id="content"><div class="card" id="empty">Select a Brief to inspect its cited findings and submit a review decision.</div></section></main><script>
const api='/v1/briefs',esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){let data=await fetch(api).then(r=>r.json());document.querySelector('#briefs').innerHTML=data.length?data.map(b=>`<button class="brief" onclick="openBrief('${b.brief_id}')"><b>${esc(b.question)}</b><br><span class="status">${esc(b.status)}</span></button>`).join(''):'<p>No Briefs yet. Create one through the API.</p>'}
function briefInput(){return {corpus_id:corpusId.value.trim(),corpus_version:corpusVersion.value.trim(),question:question.value.trim(),project_context:context.value.trim()}}
async function previewEvidence(){let input=briefInput();if(!input.question||!input.project_context){evidence.innerHTML='<div class="alert error">Question and non-sensitive project context are required.</div>';return}evidence.innerHTML='<div class="alert warning">Searching the selected snapshot for cited evidence…</div>';let r=await fetch('/v1/answers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(input)});let data=await r.json();if(!r.ok){evidence.innerHTML='<div class="alert error">Could not search this corpus snapshot. Check the corpus ID and version.</div>';return}if(data.status!=='grounded'){evidence.innerHTML='<div class="alert warning"><b>Insufficient evidence.</b> No Brief will be created. Refine the question or select a snapshot with relevant sources.</div>';return}evidence.innerHTML=`<div class="alert success"><b>Grounded evidence found.</b><br>${data.findings.length} cited passage(s) will support the draft.</div><button onclick="createBrief()">Create reviewable Brief</button>`}
async function createBrief(){evidence.innerHTML='<div class="alert warning">Creating your reviewable Brief…</div>';let r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(briefInput())});let data=await r.json();if(!r.ok){evidence.innerHTML=`<div class="alert error">Could not create Brief: ${esc(data.detail||'request failed')}</div>`;return}await load();openBrief(data.brief_id)}
async function openBrief(id){let b=await fetch(`${api}/${id}`).then(r=>r.json());let sources=b.sources.map(s=>`<li><a href="${esc(s.canonical_url)}" target="_blank">${esc(s.title)}</a> · ${esc(s.source_version)} · ${esc(s.source_type)}</li>`).join('');let findings=b.findings.map(f=>`<div class="finding"><div class="status">${esc(f.kind)} · ${esc(f.confidence)}</div><p>${esc(f.statement)}</p><div class="citation"><b>${esc(f.citation.source_id)} ${esc(f.citation.source_version)}</b> — ${esc(f.citation.locator)}<br>${esc(f.citation.support)}</div><button onclick="showForm('${b.brief_id}','${f.finding_id}')">Review this finding</button></div>`).join('');let decisions=b.review_decisions.map(d=>`<li><b>${esc(d.decision)}</b> by ${esc(d.reviewer)}: ${esc(d.rationale)}</li>`).join('')||'<li>No decisions yet</li>';document.querySelector('#content').innerHTML=`<div class="card"><div class="status">${esc(b.status)}</div><h1>${esc(b.input.question)}</h1><p>${esc(b.summary)}</p><p><b>Context:</b> ${esc(b.input.project_context)}</p><h3>Sources</h3><ul>${sources}</ul></div><div class="card"><h2>Findings</h2>${findings}</div><div class="card"><h2>Review history</h2><ul>${decisions}</ul></div><div id="form"></div>`}
function showForm(brief,finding){document.querySelector('#form').innerHTML=`<div class="card"><h2>Record review decision</h2><label>Reviewer <input id="reviewer" required></label><label>Decision <select id="decision"><option>accept</option><option>reject</option><option>correct</option><option>needs_information</option></select></label><label>Rationale <textarea id="rationale" required></textarea></label><label>Corrected statement (optional) <textarea id="corrected"></textarea></label><button onclick="submitDecision('${brief}','${finding}')">Save decision</button></div>`}
async function submitDecision(brief,finding){let body={finding_id:finding,reviewer:reviewer.value,decision:decision.value,rationale:rationale.value,corrected_statement:corrected.value||null};let r=await fetch(`${api}/${brief}/review-decisions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){alert('Could not save decision');return}await load();openBrief(brief)}document.querySelector('#refresh').onclick=load;load();
</script></body></html>
