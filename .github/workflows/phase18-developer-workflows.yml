name: Phase 18 Developer Workflows

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  platform-api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: healthforge
          POSTGRES_USER: healthforge
          POSTGRES_PASSWORD: healthforge
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U healthforge -d healthforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      HEALTHFORGE_DB_URL: jdbc:postgresql://localhost:5433/healthforge
      HEALTHFORGE_DB_USERNAME: healthforge
      HEALTHFORGE_DB_PASSWORD: healthforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Wait for Postgres
        run: |
          for attempt in {1..30}; do
            if pg_isready -h localhost -p 5433 -U healthforge -d healthforge; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time." >&2
          exit 1
      - name: Run platform API tests
        working-directory: apps/platform-api
        run: mvn -q test

  developer-surface-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install VS Code extension dependencies
        working-directory: apps/vscode-extension
        run: npm install --no-package-lock
      - name: Compile VS Code extension
        working-directory: apps/vscode-extension
        run: npm run compile
      - name: CLI smoke check
        run: node apps/cli/bin/healthforge.js help
      - name: SDK import smoke check
        run: node -e "const sdk = require('./packages/sdk-js/src'); if (!sdk.HealthForgeClient) { process.exit(1); } console.log('sdk-ok');"
