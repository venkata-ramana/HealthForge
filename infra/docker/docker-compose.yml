services:
  postgres:
    image: postgres:17-alpine
    container_name: healthforge-postgres
    environment:
      POSTGRES_DB: healthforge
      POSTGRES_USER: healthforge
      POSTGRES_PASSWORD: healthforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthforge -d healthforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - healthforge-postgres:/var/lib/postgresql/data

volumes:
  healthforge-postgres:
