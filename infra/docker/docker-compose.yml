services:
  postgres:
    image: postgres:17-alpine
    container_name: healthforge-postgres
    environment:
      POSTGRES_DB: healthforge
      POSTGRES_USER: healthforge
      POSTGRES_PASSWORD: healthforge
    ports:
      - "${HEALTHFORGE_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthforge -d healthforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - healthforge-postgres:/var/lib/postgresql/data

  platform-api:
    build:
      context: ../../apps/platform-api
      dockerfile: Dockerfile
    container_name: healthforge-platform-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HEALTHFORGE_DB_URL: jdbc:postgresql://postgres:5432/healthforge
      HEALTHFORGE_DB_USERNAME: healthforge
      HEALTHFORGE_DB_PASSWORD: healthforge
      HEALTHFORGE_ARTIFACT_DIRECTORY: /var/lib/healthforge/artifacts
      HEALTHFORGE_WORKSPACE_ROOT: /workspace
    ports:
      - "${HEALTHFORGE_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - healthforge-artifacts:/var/lib/healthforge/artifacts
      - ../../:/workspace:ro

volumes:
  healthforge-postgres:
  healthforge-artifacts:
