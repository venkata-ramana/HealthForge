openapi: 3.1.0
info:
  title: HealthForge Knowledge Ingestion and Retrieval API
  version: 0.1.0
  description: >-
    Administrative ingestion and citeable evidence retrieval for curated, public,
    versioned healthcare-interoperability sources. This API does not accept PHI,
    arbitrary uploads, or requests for generated compliance conclusions.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /v1/briefs:
    get:
      operationId: listBriefs
      summary: List persisted Brief summaries for local review clients
      tags: [briefs]
      responses:
        '200':
          description: Brief summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BriefSummary'
    post:
      operationId: createBrief
      summary: Create a cited Brief draft from grounded evidence
      tags: [briefs]
      parameters:
        - $ref: '#/components/parameters/HealthForgeActor'
        - $ref: '#/components/parameters/HealthForgeRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BriefRequest'
      responses:
        '200':
          description: Persisted Brief draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Reviewer or administrator role required
        '422':
          description: Brief cannot be created without grounded evidence
  /v1/briefs/{briefId}:
    get:
      operationId: getBrief
      summary: Get a persisted Brief with findings, review history, approvals, and audit trail
      tags: [briefs]
      parameters:
        - $ref: '#/components/parameters/BriefId'
      responses:
        '200':
          description: Full Brief
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/briefs/{briefId}/review-decisions:
    post:
      operationId: recordBriefReviewDecision
      summary: Record a reviewer decision for a Brief finding
      tags: [briefs]
      parameters:
        - $ref: '#/components/parameters/BriefId'
        - $ref: '#/components/parameters/HealthForgeActor'
        - $ref: '#/components/parameters/HealthForgeRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecisionRequest'
      responses:
        '200':
          description: Updated Brief
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Reviewer or administrator role required
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/briefs/{briefId}/approvals:
    post:
      operationId: approveBrief
      summary: Approve a Brief for downstream export
      tags: [briefs]
      parameters:
        - $ref: '#/components/parameters/BriefId'
        - $ref: '#/components/parameters/HealthForgeActor'
        - $ref: '#/components/parameters/HealthForgeRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Approved Brief
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Administrator role required
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Brief is not in an approvable state
  /v1/briefs/{briefId}/audit-export:
    get:
      operationId: exportBriefAudit
      summary: Export Brief review, approval, and audit history as non-sensitive JSON
      tags: [briefs]
      parameters:
        - $ref: '#/components/parameters/BriefId'
      responses:
        '200':
          description: Audit export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefAuditExportResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/ingestions:
    post:
      operationId: requestIngestion
      summary: Request ingestion of a manifest-approved source version
      tags: [administration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionRequest'
      responses:
        '202':
          description: Ingestion job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionJob'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Source is not allowed by the active manifest or data policy
  /v1/ingestions/{ingestionId}:
    get:
      operationId: getIngestionJob
      summary: Get ingestion job state and provenance validation result
      tags: [administration]
      parameters:
        - $ref: '#/components/parameters/IngestionId'
      responses:
        '200':
          description: Ingestion job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionJob'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/source-versions/{sourceVersionId}:
    get:
      operationId: getSourceVersion
      summary: Get lifecycle and terms-review metadata for an ingested source version
      tags: [administration]
      parameters:
        - name: sourceVersionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Source version metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceVersion'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/source-versions/{sourceVersionId}/lifecycle:
    post:
      operationId: updateSourceLifecycle
      summary: Mark a source version active or withdrawn
      tags: [administration]
      parameters:
        - name: sourceVersionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, withdrawn]
      responses:
        '200':
          description: Updated source version metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceVersion'
        '403':
          description: Administrator role required
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/corpus-snapshots:
    post:
      operationId: createCorpusSnapshot
      summary: Create an immutable current or historical corpus snapshot
      tags: [administration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorpusSnapshotRequest'
      responses:
        '200':
          description: Snapshot created
        '409':
          description: Snapshot already exists
        '422':
          description: Selected source versions are not eligible for the requested snapshot mode
  /v1/fhir-validation/validate:
    post:
      operationId: validateFhirExample
      summary: Validate a synthetic or explicitly non-sensitive FHIR example against a pinned profile
      tags: [validation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FhirValidationRequest'
      responses:
        '200':
          description: Validation findings with human-review guardrails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FhirValidationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          description: Requested package/profile selection is not supported in the pinned catalog
  /v1/fhir-validation/catalog:
    get:
      operationId: getFhirValidationCatalog
      summary: Get the pinned FHIR package and profile catalog for deterministic validation
      tags: [validation]
      responses:
        '200':
          description: Supported and planned FHIR package/profile inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FhirValidationCatalogResponse'
  /v1/standards-artifacts:
    get:
      operationId: listStandardsArtifacts
      summary: List curated FHIR and implementation-guide artifacts by canonical URL or artifact name
      tags: [validation]
      parameters:
        - name: canonical_url
          in: query
          required: false
          schema:
            type: string
        - name: artifact_name
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Matching standards artifacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardsArtifactResponse'
  /v1/retrieval/search:
    post:
      operationId: searchEvidence
      summary: Retrieve citeable passages from an exact corpus snapshot
      tags: [retrieval]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrievalRequest'
      responses:
        '200':
          description: Ranked citeable passage results; no generated answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Corpus snapshot not found
  /v1/briefs/{briefId}/work-item-export:
    get:
      operationId: exportBriefWorkItems
      summary: Export approved Brief findings as structured implementation work items
      tags: [briefs]
      parameters:
        - name: briefId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Non-sensitive work-item export derived from an approved Brief
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefWorkItemExportResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Brief is not approved for export
  /v1/architecture-reviews:
    post:
      operationId: createArchitectureReview
      summary: Create a bounded architecture-review artifact for a non-sensitive scenario
      tags: [architecture]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchitectureReviewRequest'
      responses:
        '200':
          description: Architecture review artifact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchitectureReviewResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
components:
  parameters:
    BriefId:
      name: briefId
      in: path
      required: true
      schema:
        type: string
        pattern: '^brief_[a-zA-Z0-9_-]+$'
    HealthForgeActor:
      name: X-HealthForge-Actor
      in: header
      required: false
      schema:
        type: string
      description: Local actor ID used for review, approval, and audit events in non-production flows.
    HealthForgeRole:
      name: X-HealthForge-Role
      in: header
      required: false
      schema:
        type: string
        enum: [reviewer, administrator]
      description: Local role header used for non-production review and approval flows.
    IngestionId:
      name: ingestionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^ing_[a-zA-Z0-9_-]+$'
  responses:
    NotFound:
      description: Requested record was not found
    ValidationError:
      description: Request violates contract or data-policy validation
      content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  schemas:
    BriefRequest:
      type: object
      additionalProperties: false
      required: [corpus_id, corpus_version, question, project_context]
      properties:
        corpus_id:
          type: string
        corpus_version:
          type: string
        question:
          type: string
          maxLength: 2000
        project_context:
          type: string
          maxLength: 2000
        source_types:
          type: array
          items:
            type: string
    ReviewDecisionRequest:
      type: object
      additionalProperties: false
      required: [finding_id, decision, rationale]
      properties:
        finding_id:
          type: string
        decision:
          type: string
          enum: [accept, reject, correct, needs_information]
        reviewer:
          type: string
          maxLength: 255
        rationale:
          type: string
          maxLength: 2000
        corrected_statement:
          type: string
          maxLength: 4000
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [rationale]
      properties:
        rationale:
          type: string
          maxLength: 2000
    BriefSummary:
      type: object
      additionalProperties: false
      required: [brief_id, status, created_at, question]
      properties:
        brief_id:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        question:
          type: string
    BriefResponse:
      type: object
      additionalProperties: false
      required:
        - brief_id
        - status
        - created_at
        - input
        - sources
        - findings
        - summary
        - limitations
        - review_decisions
        - approvals
        - audit_events
        - requires_human_review
      properties:
        brief_id:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        input:
          type: object
          additionalProperties: false
          required: [question, project_context, corpus_id, corpus_version]
          properties:
            question:
              type: string
            project_context:
              type: string
            corpus_id:
              type: string
            corpus_version:
              type: string
        sources:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [source_id, source_version, source_type, title, canonical_url]
            properties:
              source_id:
                type: string
              source_version:
                type: string
              source_type:
                type: string
              title:
                type: string
              canonical_url:
                type: string
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [finding_id, kind, statement, confidence, citation]
            properties:
              finding_id:
                type: string
              kind:
                type: string
              statement:
                type: string
              confidence:
                type: string
              citation:
                type: object
                additionalProperties: false
                required: [source_id, source_version, locator, support]
                properties:
                  source_id:
                    type: string
                  source_version:
                    type: string
                  locator:
                    type: string
                  support:
                    type: string
        summary:
          type: string
        limitations:
          type: array
          items:
            type: string
        review_decisions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [review_id, finding_id, decision, reviewer, decided_at, rationale]
            properties:
              review_id:
                type: string
              finding_id:
                type: string
              decision:
                type: string
              reviewer:
                type: string
              decided_at:
                type: string
                format: date-time
              rationale:
                type: string
              corrected_statement:
                type: string
                nullable: true
        approvals:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [approval_id, approver, approver_role, approved_at, rationale]
            properties:
              approval_id:
                type: string
              approver:
                type: string
              approver_role:
                type: string
              approved_at:
                type: string
                format: date-time
              rationale:
                type: string
        audit_events:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [audit_event_id, actor_id, actor_role, event_type, occurred_at, summary]
            properties:
              audit_event_id:
                type: string
              actor_id:
                type: string
              actor_role:
                type: string
              event_type:
                type: string
              occurred_at:
                type: string
                format: date-time
              summary:
                type: string
              details:
                type: string
                nullable: true
        requires_human_review:
          type: boolean
    BriefAuditExportResponse:
      type: object
      additionalProperties: false
      required: [brief_id, status, created_at, corpus_id, corpus_version, review_decisions, approvals, audit_events]
      properties:
        brief_id:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        corpus_id:
          type: string
        corpus_version:
          type: string
        review_decisions:
          type: array
          items:
            type: object
        approvals:
          type: array
          items:
            type: object
        audit_events:
          type: array
          items:
            type: object
    Error:
      type: object
      additionalProperties: false
      required: [timestamp, status, error, detail, path, request_id, errors]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        detail:
          type: string
        path:
          type: string
        request_id:
          type: string
          nullable: true
        errors:
          type: array
          items:
            type: string
    IngestionRequest:
      type: object
      additionalProperties: false
      required:
        - manifest_source_id
        - source_version
        - canonical_url
        - expected_content_type
        - allowed_use
        - terms_review_decision
        - terms_reviewed_by
      properties:
        manifest_source_id:
          type: string
          description: ID selected in the approved corpus manifest
        source_version:
          type: string
          description: Publisher document/package version; never an unpinned continuous build
        canonical_url:
          type: string
          format: uri
        expected_content_type:
          type: string
          enum: [application/pdf, text/html, application/fhir+json, application/json]
        requested_by:
          type: string
          description: Non-sensitive local administrator identity
        allowed_use:
          type: string
          description: Approved use classification for the stored artifact
        terms_review_decision:
          type: string
          enum: [approved, restricted, rejected]
        terms_reviewed_by:
          type: string
          description: Non-sensitive reviewer identity for the use/terms decision
    IngestionJob:
      type: object
      additionalProperties: false
      required:
        - ingestion_id
        - status
        - manifest_source_id
        - requested_at
      properties:
        ingestion_id:
          type: string
          pattern: '^ing_[a-zA-Z0-9_-]+$'
        status:
          enum: [requested, fetching, validating, indexed, active, superseded, withdrawn, rejected]
        manifest_source_id:
          type: string
        requested_at:
          type: string
          format: date-time
        source_version_id:
          type: string
          pattern: '^srcver_[a-zA-Z0-9_-]+$'
        artifact_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        parser_version:
          type: string
        chunking_version:
          type: string
        errors:
          type: array
          items:
            type: string
    CorpusSnapshotRequest:
      type: object
      additionalProperties: false
      required: [corpus_id, corpus_version, source_version_ids]
      properties:
        corpus_id:
          type: string
        corpus_version:
          type: string
        source_version_ids:
          type: array
          minItems: 1
          items:
            type: string
        include_historical_sources:
          type: boolean
          default: false
          description: Explicitly allow superseded or withdrawn source versions for historical reconstruction
    SourceVersion:
      type: object
      additionalProperties: false
      required:
        - source_version_id
        - manifest_source_id
        - source_version
        - source_type
        - title
        - canonical_url
        - artifact_sha256
        - content_type
        - retrieved_at
        - parser_version
        - chunking_version
        - status
        - allowed_use
        - terms_review_decision
        - terms_reviewed_by
        - terms_reviewed_at
        - eligible_for_current_snapshot
      properties:
        source_version_id:
          type: string
        manifest_source_id:
          type: string
        source_version:
          type: string
        source_type:
          type: string
        title:
          type: string
        canonical_url:
          type: string
          format: uri
        artifact_sha256:
          type: string
        content_type:
          type: string
        retrieved_at:
          type: string
          format: date-time
        parser_version:
          type: string
        chunking_version:
          type: string
        status:
          enum: [indexed, active, superseded, withdrawn, rejected]
        allowed_use:
          type: string
        terms_review_decision:
          enum: [approved, restricted, rejected]
        terms_reviewed_by:
          type: string
        terms_reviewed_at:
          type: string
          format: date-time
        superseded_by_source_version_id:
          type: string
        eligible_for_current_snapshot:
          type: boolean
    FhirValidationRequest:
      type: object
      additionalProperties: false
      required:
        - package_id
        - package_version
        - profile_url
        - data_classification
        - resource
      properties:
        package_id:
          type: string
        package_version:
          type: string
        profile_url:
          type: string
          format: uri
        data_classification:
          type: string
          enum: [synthetic, non_sensitive]
        resource:
          type: object
          description: FHIR JSON resource payload
    FhirValidationResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - selected_package
        - data_classification
        - human_review_required
        - implementation_guidance_status
        - summary
        - findings
        - evidence_links
      properties:
        status:
          type: string
          enum: [valid, invalid]
        selected_package:
          type: object
          additionalProperties: false
          required: [package_id, package_version, package_title, package_kind, profile_url, profile_title, validation_boundary, validation_scope]
          properties:
            package_id:
              type: string
            package_version:
              type: string
            package_title:
              type: string
            package_kind:
              type: string
              enum: [base_specification, implementation_guide]
            profile_url:
              type: string
              format: uri
            profile_title:
              type: string
            validation_boundary:
              type: string
            validation_scope:
              type: string
        data_classification:
          type: string
          enum: [synthetic, non_sensitive]
        human_review_required:
          type: boolean
        implementation_guidance_status:
          type: string
          enum: [human_review_required]
        summary:
          type: string
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [severity, location, message, message_id, evidence_links]
            properties:
              severity:
                type: string
              location:
                type: string
              message:
                type: string
              message_id:
                type: string
              evidence_links:
                type: array
                items:
                  type: string
                  format: uri
        evidence_links:
          type: array
          items:
            type: string
            format: uri
    FhirValidationCatalogResponse:
      type: object
      additionalProperties: false
      required: [packages]
      properties:
        packages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [package_id, package_version, package_title, package_kind, support_status, validation_boundary, package_evidence_link, profiles]
            properties:
              package_id:
                type: string
              package_version:
                type: string
              package_title:
                type: string
              package_kind:
                type: string
                enum: [base_specification, implementation_guide]
              support_status:
                type: string
                enum: [supported, planned]
              validation_boundary:
                type: string
              package_evidence_link:
                type: string
                format: uri
              profiles:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [profile_url, profile_title, support_status, validation_scope, profile_evidence_link]
                  properties:
                    profile_url:
                      type: string
                      format: uri
                    profile_title:
                      type: string
                    support_status:
                      type: string
                      enum: [supported, planned]
                    validation_scope:
                      type: string
                    profile_evidence_link:
                      type: string
                      format: uri
    StandardsArtifactResponse:
      type: object
      additionalProperties: false
      required: [artifacts]
      properties:
        artifacts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [artifact_id, canonical_url, title, version, artifact_type, package_id, source_id, source_version, support_boundary, evidence_links, keywords]
            properties:
              artifact_id:
                type: string
              canonical_url:
                type: string
                format: uri
              title:
                type: string
              version:
                type: string
              artifact_type:
                type: string
                enum: [resource, profile, operation, value_set, implementation_guide]
              package_id:
                type: string
              source_id:
                type: string
              source_version:
                type: string
              support_boundary:
                type: string
              evidence_links:
                type: array
                items:
                  type: string
                  format: uri
              keywords:
                type: array
                items:
                  type: string
    BriefWorkItemExportResponse:
      type: object
      additionalProperties: false
      required:
        - brief_id
        - brief_status
        - created_at
        - exported_at
        - approval_status
