        corpus_id:
          type: string
        corpus_version:
          type: string
        question:
          type: string
        project_context:
          type: string
        source_types:
          type: array
          items:
            type: string
    ArchitectureReviewResponse:
      type: object
      additionalProperties: false
      required:
        - review_id
        - status
        - created_at
        - input
        - summary
        - components
        - integrations
        - standards_touchpoints
        - assumptions
        - risks
        - review_checkpoints
        - evidence_findings
        - human_review_required
        - review_notice
      properties:
        review_id:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        input:
          type: object
          additionalProperties: false
          required: [corpus_id, corpus_version, question, project_context]
          properties:
            corpus_id:
              type: string
            corpus_version:
              type: string
            question:
              type: string
            project_context:
              type: string
        summary:
          type: string
        components:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, role, rationale]
            properties:
              name:
                type: string
              role:
                type: string
              rationale:
                type: string
        integrations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [system, interaction, rationale]
            properties:
              system:
                type: string
              interaction:
                type: string
              rationale:
                type: string
        standards_touchpoints:
          type: array
          items:
            type: string
        assumptions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [statement, validation_needed]
            properties:
              statement:
                type: string
              validation_needed:
                type: string
        risks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, why_it_matters, mitigation_focus]
            properties:
              name:
                type: string
              why_it_matters:
                type: string
              mitigation_focus:
                type: string
        review_checkpoints:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [checkpoint, reason]
            properties:
              checkpoint:
                type: string
              reason:
                type: string
        evidence_findings:
          type: array
          items:
            type: object
        human_review_required:
          type: boolean
        review_notice:
          type: string
    RetrievalRequest:
      type: object
      additionalProperties: false
      required: [corpus_id, corpus_version, query]
      properties:
        corpus_id:
          type: string
        corpus_version:
          type: string
        query:
          type: string
          minLength: 1
          description: Non-sensitive engineering question
        source_types:
          type: array
          uniqueItems: true
          items:
            enum: [governing_regulation, authoritative_implementation_guidance, candidate_technical_guidance, internal_project_material]
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
    RetrievalResponse:
      type: object
      additionalProperties: false
      required: [corpus_id, corpus_version, index_generation_id, results]
      properties:
        corpus_id:
          type: string
        corpus_version:
          type: string
        index_generation_id:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalResult'
    RetrievalResult:
      type: object
      additionalProperties: false
      required:
        - passage_id
        - excerpt
        - rank
        - score
        - source
      properties:
        passage_id:
          type: string
          pattern: '^passage_[a-zA-Z0-9_-]+$'
        excerpt:
          type: string
        rank:
          type: integer
          minimum: 1
        score:
          type: number
          description: Diagnostic ranking score; not evidence strength or compliance confidence
        source:
          $ref: '#/components/schemas/CiteableSource'
    CiteableSource:
      type: object
      additionalProperties: false
      required: [source_id, source_version, source_type, title, canonical_url, locator]
      properties:
        source_id:
          type: string
        source_version:
          type: string
        source_type:
          enum: [governing_regulation, authoritative_implementation_guidance, candidate_technical_guidance, internal_project_material]
        title:
          type: string
        canonical_url:
          type: string
          format: uri
        locator:
          type: string
          description: Stable page/section, artifact/anchor, or immutable snapshot locator
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
